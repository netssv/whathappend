<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WhatHappened Terminal</title>

    <!-- xterm.js v5 local bundle (UMD — must be classic scripts) -->
    <link rel="stylesheet" href="lib/xterm.min.css" />
    <script src="lib/xterm.min.js"></script>
    <script src="lib/addon-fit.min.js"></script>
    <script src="lib/addon-web-links.min.js"></script>
    <script src="lib/dompurify.min.js"></script>

    <!-- Custom theme -->
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- Active tab context display with logo -->
    <div id="context-bar">
        <div class="context-row context-top">
            <div id="logo-wrapper" title="Main Menu">
                <img id="context-logo" src="icons/icon.svg" alt="WH" width="16" height="16" />
                <span class="logo-caret">▾</span>
                <!-- Logo dropdown menu (Injected dynamically via header-logo-menu.js) -->
                <div id="logo-menu" class="logo-menu"></div>
            </div>
            <input id="context-domain" type="text" value="No active target" readonly spellcheck="false" autocomplete="off" aria-label="Active Target Domain" title="Active Target Domain" />
            <div id="font-controls">
                <button id="font-decrease" title="Decrease font size (min 10px)">−</button>
                <button id="font-increase" title="Increase font size (max 20px)">+</button>
            </div>
            <span id="context-version"></span>
            <button id="shield-btn" class="shield-btn" title="Content Blocking">
                <span id="shield-icon">🛡</span>
            </button>
        </div>
        <div id="context-triad">
            <!-- Row 1: Status -->
            <div class="triad-row">
                <div class="triad-col" title="HTTP Response Code">
                    <span class="triad-label triad-label--http">HTTP</span>
                    <span id="context-http" class="triad-value"></span>
                </div>
                <div class="triad-col" title="SSL Certificate Status">
                    <span class="triad-label triad-label--sec">SSL</span>
                    <span id="context-ssl" class="triad-value"></span>
                </div>
            </div>
            <!-- Row 2: Registration -->
            <div class="triad-row">
                <div class="triad-col" title="Domain Registrar">
                    <span class="triad-label">REG</span>
                    <span id="context-registrar" class="triad-value"></span>
                </div>
                <div class="triad-col" title="Nameserver Provider">
                    <span class="triad-label">NS</span>
                    <span id="context-ns" class="triad-value"></span>
                </div>
            </div>
            <!-- Row 3: Hosting -->
            <div class="triad-row">
                <div class="triad-col" title="Web Hosting Provider">
                    <span class="triad-label triad-label--host">HOST</span>
                    <span id="context-host" class="triad-value"></span>
                </div>
                <div class="triad-col" title="Technology Stack / WAF Detection">
                    <span class="triad-label triad-label--host">STACK</span>
                    <span class="triad-value" id="context-cdn"></span>
                </div>
            </div>
            <!-- Row 4: Network -->
            <div class="triad-row">
                <div class="triad-col" title="Server IP Address">
                    <span class="triad-label triad-label--net">IP</span>
                    <span id="context-ip" class="triad-value"></span>
                </div>
                <div class="triad-col" title="Server Geolocation">
                    <span class="triad-label triad-label--net">GEO</span>
                    <span id="context-geo" class="triad-value"></span>
                </div>
            </div>
            <!-- Row 5: Mail & Client -->
            <div class="triad-row">
                <div class="triad-col" title="Mail Exchange Record">
                    <span class="triad-label triad-label--mail">MX</span>
                    <span id="context-mx" class="triad-value"></span>
                </div>
                <div class="triad-col" title="Your Public IP">
                    <span class="triad-label triad-label--my">MY</span>
                    <span id="context-myip" class="triad-value"></span>
                </div>
            </div>
        </div>
        <!-- Peek tab — bounces to invite expanding the triad -->
        <div id="header-peek-tab" title="Toggle Infrastructure Data">
            <span class="peek-icon">▾</span>
            <span class="peek-label">SITE INTEL</span>
        </div>

        <!-- Active emulation indicators (UA, Throttle, Geo) -->
        <div id="emulation-bar" class="emulation-bar"></div>

        <!-- Content Block Panel (collapsible) -->
        <div id="block-panel">
            <label class="block-toggle">
                <input type="checkbox" id="block-js" />
                <span class="block-label">JavaScript</span>
            </label>
            <label class="block-toggle">
                <input type="checkbox" id="block-images" />
                <span class="block-label">Images</span>
            </label>
            <label class="block-toggle">
                <input type="checkbox" id="block-cookies" />
                <span class="block-label">Cookies</span>
            </label>
            <label class="block-toggle">
                <input type="checkbox" id="block-css" />
                <span class="block-label">CSS</span>
            </label>
            <label class="block-toggle">
                <input type="checkbox" id="block-fonts" />
                <span class="block-label">Fonts</span>
            </label>
            <label class="block-toggle">
                <input type="checkbox" id="block-popups" />
                <span class="block-label">Popups</span>
            </label>
            <button id="block-reload" class="block-reload-btn" title="Reload tab to apply">↻</button>
            <span id="block-status" class="block-status"></span>
        </div>
    </div>

    <!-- Tab-switch notification bar -->
    <div id="tab-switch-bar">
        <span id="tab-switch-icon">↗</span>
        <span id="tab-switch-label">Tab changed →</span>
        <span id="tab-switch-domain"></span>
        <button id="tab-switch-btn" title="Switch target to this domain">Switch</button>
        <button id="tab-switch-dismiss" title="Keep current target">✕</button>
    </div>

    <!-- Reusable internal popup dialog -->
    <div id="wh-modal-overlay" class="wh-modal-overlay">
        <div id="wh-modal" class="wh-modal">
            <div class="wh-modal-header">
                <span id="wh-modal-title" class="wh-modal-title"></span>
                <button id="wh-modal-close" class="wh-modal-close" title="Close">✕</button>
            </div>
            <div id="wh-modal-body" class="wh-modal-body"></div>
            <div id="wh-modal-footer" class="wh-modal-footer"></div>
        </div>
    </div>

    <!-- Terminal Multiplexer Tabs Bar -->
    <div id="terminal-tabs-bar" class="terminal-tabs-bar">
        <!-- Tabs injected dynamically -->
        <div class="multiplexer-tab active" data-tab-id="1" title="Primary Session">
            <span class="tab-indicator">●</span>
            <span class="tab-title">Term 1</span>
        </div>
        <button id="multiplexer-add-btn" class="multiplexer-add-btn" title="New Terminal Session">+</button>
    </div>

    <div id="terminal-container"></div>

    <!-- Application entry point (ES Module) -->
    <script type="module" src="terminal-main.js"></script>
</body>

</html>
